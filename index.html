<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="Portfolio de Carolus Zyad TOGONOU, géomaticien et analyste environnemental spécialisé en cartographie, SIG, télédétection et analyse spatiale.">
  <title>Carolus Zyad TOGONOU | Atlas personnel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101b2b;
      --navy-light: #1a2a40;
      --paper: #f3efe5;
      --paper-light: #faf8f1;
      --orange: #d96c3f;
      --orange-dark: #b74f29;
      --green: #b7c96a;
      --text: #192434;
      --muted: #69717a;
      --line: rgba(25, 36, 52, .16);
      --mono: "DM Mono", monospace;
      --sans: "DM Sans", sans-serif;
      --serif: "Playfair Display", Georgia, serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--navy);
      color: var(--text);
      font-family: var(--sans);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button { font: inherit; }

    button, a { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 4px;
    }

    ::selection {
      background: var(--orange);
      color: #fff;
    }

    .site-header {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 20px 5vw;
      color: var(--paper);
      border-bottom: 1px solid rgba(243,239,229,.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font: 10px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      background: var(--orange);
      color: var(--navy);
      font: 700 18px var(--serif);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-index {
      color: rgba(243,239,229,.6);
      font: 10px var(--mono);
      letter-spacing: .1em;
    }

    .header-index span { color: var(--green); }

    .menu-toggle {
      display: none;
      border: 0;
      background: transparent;
      color: var(--paper);
      cursor: pointer;
      font-size: 23px;
    }

    .book-navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 15px 18px 21px;
      color: var(--paper);
    }

    .nav-link {
      padding: 10px 12px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(243,239,229,.68);
      font: 9px var(--mono);
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
    }

    .nav-link:hover {
      color: var(--paper);
      border-color: rgba(243,239,229,.2);
    }

    .nav-link.active {
      color: var(--paper);
      border-color: var(--orange);
      background: rgba(217,108,63,.12);
    }

    .book-area {
      width: min(1160px, 92vw);
      margin: 8px auto 0;
      perspective: 1800px;
    }

    .book {
      position: relative;
      isolation: isolate;
      background: var(--paper);
      box-shadow: 0 28px 85px rgba(0,0,0,.27), 0 4px 14px rgba(0,0,0,.16);
    }

    .book::before, .book::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 5px;
      pointer-events: none;
      background: repeating-linear-gradient(to right, #d4cdbd 0 1px, #eee8db 1px 3px);
    }

    .book::before { left: -5px; }
    .book::after { right: -5px; }

    .chapter {
      display: none;
      width: 100%;
      min-width: 0;
      background: var(--paper);
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .chapter.active {
      display: block;
      animation: pageEnter .45s ease both;
    }

    .chapter.turn-forward {
      display: block;
      animation: turnForward .32s ease both;
    }

    .chapter.turn-backward {
      display: block;
      transform-origin: right center;
      animation: turnBackward .32s ease both;
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateX(12px) rotateY(-3deg);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotateY(0);
      }
    }

    @keyframes turnForward {
      from {
        opacity: 1;
        transform: rotateY(0);
      }
      to {
        opacity: 0;
        transform: rotateY(-12deg);
      }
    }

    @keyframes turnBackward {
      from {
        opacity: 1;
        transform: rotateY(0);
      }
      to {
        opacity: 0;
        transform: rotateY(12deg);
      }
    }

    .chapter-inner {
      padding: clamp(30px, 5.2vw, 58px) clamp(22px, 7%, 80px);
    }

    .chapter-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 38px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font: 9px var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .chapter-number { color: var(--orange-dark); }

    .eyebrow {
      margin: 0 0 15px;
      color: var(--orange-dark);
      font: 10px/1.7 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      margin-top: 0;
      font-weight: 500;
    }

    h1, h2, .serif { font-family: var(--serif); }

    .chapter-title {
      max-width: 800px;
      margin-bottom: 20px;
      font: 500 clamp(34px, 5vw, 61px)/1.1 var(--serif);
      letter-spacing: -.04em;
      overflow-wrap: anywhere;
    }

    .chapter-description, .gallery-intro {
      max-width: 690px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.85;
    }

    .chapter-footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 44px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 9px/1.7 var(--mono);
    }

    .chapter-footer strong {
      color: var(--text);
      font-weight: 500;
    }

    .cover {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      min-height: 620px;
      overflow: hidden;
      background: var(--navy);
      color: var(--paper);
    }

    .cover-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 35px;
      min-width: 0;
      padding: clamp(30px, 5vw, 62px) 0 30px clamp(24px, 7%, 76px);
    }

    .cover-topline {
      color: var(--green);
      font: 9px/1.8 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .cover h1 {
      margin: 35px 0 23px;
      font: 500 clamp(42px, 5.6vw, 74px)/1 var(--serif);
      letter-spacing: -.055em;
      overflow-wrap: anywhere;
    }

    .cover h1 span {
      display: block;
      margin-top: 7px;
      color: var(--orange);
    }

    .cover-role {
      max-width: 380px;
      color: rgba(243,239,229,.72);
      font-size: 13px;
      line-height: 1.9;
    }

    .cover-cta {
      display: inline-flex;
      align-items: center;
      gap: 17px;
      width: fit-content;
      max-width: 100%;
      margin-top: 26px;
      padding: 14px 17px;
      border: 0;
      background: var(--orange);
      color: var(--navy);
      font: 9px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .cover-cta:hover {
      background: var(--green);
      transform: translateY(-2px);
    }

    .cover-bottom {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 15px;
      padding-top: 17px;
      border-top: 1px solid rgba(243,239,229,.17);
      color: rgba(243,239,229,.55);
      font: 8px/1.7 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .cover-art {
      position: relative;
      min-width: 0;
      min-height: 620px;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 45%, rgba(217,108,63,.15), transparent 47%), var(--navy-light);
    }

    .cover-art::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .3;
      background-image: linear-gradient(rgba(243,239,229,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(243,239,229,.12) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(243,239,229,.22);
      border-radius: 50%;
      transform: translate(-50%,-50%) rotate(-28deg);
    }

    .orbit-one { width: 85%; height: 57%; }
    .orbit-two { width: 66%; height: 88%; transform: translate(-50%,-50%) rotate(32deg); }
    .orbit-three { width: 105%; height: 37%; transform: translate(-50%,-50%) rotate(57deg); }

    .map-contours {
      position: absolute;
      inset: 8%;
      width: 84%;
      height: 84%;
      opacity: .9;
    }

    .map-contours path {
      fill: none;
      stroke: var(--green);
      stroke-width: .7;
      vector-effect: non-scaling-stroke;
    }
  </style>
</head>
